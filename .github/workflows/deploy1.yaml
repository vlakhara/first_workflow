name: Deployment 1
on: push
jobs:
  Lint:
    name: Check Lint Issues
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install NodeJs
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm install
      - name: Run Lint
        run: npm run lint
